name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  UV_VERSION: "0.13.9"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: |
          pip install "uv==$UV_VERSION"
          uv sync --frozen --all-extras
      - name: Run tests with coverage
        run: uv run --frozen pytest --cov=main --cov-report=term-missing --cov-fail-under=95 tests/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
      - name: Install locked tools
        run: |
          pip install "uv==$UV_VERSION"
          uv sync --frozen --all-extras
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy main.py
      - name: Verify container lock matches uv.lock
        run: |
          uv export --frozen --no-dev --no-emit-project --output-file requirements.txt
          git diff --exit-code -- requirements.txt
      - name: Build distribution
        run: uv build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
      - name: Build container and validate Compose
        run: |
          docker compose config --quiet
          docker build -t olivetin-mcp:test .
      - name: Start isolated demo containers
        run: |
          docker network create olivetin-test
          docker run -d --name olivetin-test --network olivetin-test \
            -p 127.0.0.1:19337:1337 \
            -v "$PWD/examples/olivetin:/config:ro" \
            jamesread/olivetin:3000.22.0@sha256:e8441343ab8e3d13daa83f4cb2a00d9fa3510953a6040a556a805918f5636264
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:19337/readyz; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:19337/readyz > /dev/null
          docker run -d --name bridge-test --network olivetin-test \
            -p 127.0.0.1:19003:9003 --read-only \
            --tmpfs /tmp:size=32m,mode=1777,noexec,nosuid \
            --cap-drop ALL --security-opt no-new-privileges \
            -e OLIVETIN_URL=http://olivetin-test:1337 olivetin-mcp:test
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:19003/healthz; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify real OliveTin and MCP transports
        env:
          OLIVETIN_TEST_URL: http://127.0.0.1:19337
          MCP_TEST_URL: http://127.0.0.1:19003/mcp
        run: |
          pip install "uv==$UV_VERSION"
          uv sync --frozen --all-extras
          uv run --frozen pytest tests/test_integration.py -v
      - name: Show demo logs on failure
        if: failure()
        run: |
          docker logs olivetin-test || true
          docker logs bridge-test || true
