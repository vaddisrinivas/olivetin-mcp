[project]
name = "nanoclaw-host-bridge"
version = "2.0.0"
description = "claw-host-bridge — hardened MCP SSE server over OliveTin"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "jinja2>=3.1.0",
    "structlog>=24.0.0",
    "aiolimiter>=1.1.0",
    "tenacity>=8.0.0",
    # Optional: extra approval engines (WhatsApp, webhook, etc.)
    # Uncomment to enable:
    # "mcp-approval-proxy @ git+https://github.com/vaddisrinivas/mcp-approval-proxy.git",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]
