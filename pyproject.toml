[project]
name = "olivetin-mcp"
version = "0.1.0"
description = "Hardened MCP server that exposes OliveTin actions as tools with human-in-the-loop approval"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Srinivas Vaddi", email = "vaddisrinivas170497@gmail.com" },
]
keywords = ["mcp", "olivetin", "model-context-protocol", "automation", "approval", "claude", "ai-safety"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries",
    "Topic :: Internet :: WWW/HTTP",
    "Environment :: No Input/Output (Daemon)",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp>=3.0.0",
    "httpx>=0.28.1",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "jinja2>=3.1.0",
    "structlog>=24.0.0",
    "aiolimiter>=1.1.0",
    "tenacity>=8.0.0",
]

[project.scripts]
olivetin-mcp = "main:_run"

[project.urls]
Homepage = "https://github.com/vaddisrinivas/olivetin-mcp"
Repository = "https://github.com/vaddisrinivas/olivetin-mcp"
Issues = "https://github.com/vaddisrinivas/olivetin-mcp/issues"
Changelog = "https://github.com/vaddisrinivas/olivetin-mcp/blob/main/CHANGELOG.md"
Documentation = "https://github.com/vaddisrinivas/olivetin-mcp/blob/main/ARCHITECTURE.md"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]
lint = [
    "ruff>=0.8.0",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["main.py", "olivetin_mcp.py"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
