[project]
name = "olivetin-mcp"
version = "0.2.0"
description = "Hardened MCP server that exposes OliveTin actions as tools with human-in-the-loop approval"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Srinivas Vaddi", email = "vaddisrinivas170497@gmail.com" },
]
keywords = ["mcp", "olivetin", "model-context-protocol", "automation", "approval", "claude", "ai-safety"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries",
    "Topic :: Internet :: WWW/HTTP",
    "Environment :: No Input/Output (Daemon)",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp>=4.2.3,<5",
    "httpx>=0.28.1,<1",
    "pydantic>=2.14.4,<3",
    "pydantic-settings>=2.16.3,<3",
    "jinja2>=3.1.6,<4",
    "structlog>=26.1.0,<27",
    "aiolimiter>=1.3.0,<2",
    "tenacity>=9.2.1,<10",
]

[project.scripts]
olivetin-mcp = "main:_run"

[project.urls]
Homepage = "https://github.com/vaddisrinivas/olivetin-mcp"
Repository = "https://github.com/vaddisrinivas/olivetin-mcp"
Issues = "https://github.com/vaddisrinivas/olivetin-mcp/issues"
Changelog = "https://github.com/vaddisrinivas/olivetin-mcp/blob/main/CHANGELOG.md"
Documentation = "https://github.com/vaddisrinivas/olivetin-mcp/blob/main/ARCHITECTURE.md"

[project.optional-dependencies]
test = [
    "pytest>=9.2,<10",
    "pytest-asyncio>=1.5,<2",
    "pytest-cov>=7.1,<8",
]
lint = [
    "ruff>=0.17.6,<0.18",
    "mypy>=2.4.1,<3",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["main.py", "olivetin_mcp.py"]

[tool.hatch.build.targets.sdist]
# Environment templates may be replaced by external secret/config symlinks locally.
# Configuration is documented in README; never follow those links into a release.
exclude = ["/.env.example", "/.planning", "/.venv", "*.log"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
