# Example: run olivetin-mcp alongside OliveTin for local development/testing.
#
# Usage:
#   docker compose up -d
#   # MCP endpoint: http://localhost:9003/mcp

services:
  olivetin:
    image: jamesread/olivetin:3000.22.0@sha256:e8441343ab8e3d13daa83f4cb2a00d9fa3510953a6040a556a805918f5636264
    ports:
      - "127.0.0.1:1337:1337"
    volumes:
      - ./examples/olivetin:/config:ro
    restart: unless-stopped

  olivetin-mcp:
    build: .
    ports:
      - "127.0.0.1:9003:9003"
    environment:
      OLIVETIN_URL: http://olivetin:1337
      APPROVAL_BASE_URL: http://localhost:9003
    depends_on:
      olivetin:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
